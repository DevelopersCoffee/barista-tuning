model:
  base_model: HuggingFaceTB/SmolLM2-135M-Instruct
  torch_dtype: auto
  trust_remote_code: false
  use_flash_attention_2: false

data:
  train_path: examples/sample_sft.jsonl
  eval_path: examples/sample_sft.jsonl
  instruction_field: instruction
  input_field: input
  output_field: output
  max_seq_length: 1024

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj

training:
  output_dir: models/sft-smollm2-135m
  seed: 42
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  report_to: []

eval:
  model_path: models/sft-smollm2-135m
  output_dir: reports/sft-smollm2-135m
  max_eval_samples: 32
  max_new_tokens: 128
  generation_prompts:
    - "### Instruction\nWrite a short, polite order confirmation.\n\n### Response\n"

publish:
  repo_id: your-hf-username/slm-sft-smollm2-135m
  model_dir: models/sft-smollm2-135m
  private: true
  commit_message: "Publish SLM SFT adapter"
