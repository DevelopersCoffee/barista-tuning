[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-train-eval-publish"
version = "0.1.0"
description = "Bootstrap pipeline for training, evaluating, and publishing small language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.25.0",
  "pyyaml>=6.0.2",
  "rich>=13.7.1",
  "typer>=0.12.5",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.0.0",
  "datasets>=3.0.0",
  "peft>=0.13.0",
  "torch>=2.4.0",
  "transformers>=4.45.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
eval = [
  "lm-eval>=0.4.5",
]
all = [
  "accelerate>=1.0.0",
  "datasets>=3.0.0",
  "lm-eval>=0.4.5",
  "peft>=0.13.0",
  "pytest>=8.3.0",
  "ruff>=0.6.0",
  "torch>=2.4.0",
  "transformers>=4.45.0",
]

[project.scripts]
slm = "slm_train_eval_publish.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
